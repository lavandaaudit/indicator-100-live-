<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
body { background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px 0; }
h1 { margin-bottom:20px; font-size:2rem; color:#cfefff; text-align:center; }
.heatmap {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  width:95%;
  max-width:1400px;
}
.cell {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-radius:14px;
  background:#111;
  font-weight:bold;
  font-size:0.95rem;
  padding:10px 6px;
  transition:all 0.4s ease;
  position:relative;
  cursor:pointer;
  box-shadow:0 4px 15px rgba(0,0,0,0.3);
  border:1px solid #222;
}
.cell:hover {
  transform:translateY(-4px);
  box-shadow:0 8px 25px rgba(0,255,221,0.15);
}
.cell.alert {
  animation:pulseRed 1.2s infinite;
  border-color:#ff0000;
}
.cell:hover .tooltip { opacity:1; }
.tooltip {
  position:absolute;
  bottom:100%;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  padding:6px 12px;
  border-radius:8px;
  font-size:0.8rem;
  opacity:0;
  transition:opacity 0.3s;
  white-space:nowrap;
  z-index:10;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  pointer-events:none;
}
@keyframes pulseRed {
  0%{box-shadow:0 0 8px #ff0000;}
  50%{box-shadow:0 0 25px #ff0000;}
  100%{box-shadow:0 0 8px #ff0000;}
}
.center-index {
  grid-column:1/-1;
  font-size:1.6rem;
  border:3px solid #00ffdd;
  border-radius:18px;
  padding:16px;
  text-align:center;
  margin-top:14px;
  animation:glow 2.5s infinite alternate;
  background:#111;
  box-shadow:0 6px 20px rgba(0,255,221,0.2);
}
@keyframes glow {
  from{box-shadow:0 0 10px #00ffdd;}
  to{box-shadow:0 0 30px #00ffdd;}
}
#pulseCanvas {
  margin-top:24px;
  background:linear-gradient(#111,#0a0a0a);
  border-radius:14px;
  width:90%;
  max-width:1400px;
  height:200px;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
}
.trendCanvas {
  width:100%;
  height:80px;
  margin-top:8px;
  background:#0f0f0f;
  border-radius:6px;
}
@media (max-width:600px) {
  .cell { font-size:0.85rem; padding:8px 4px; }
  .trendCanvas { height:65px; }
  .center-index { font-size:1.4rem; }
}

const теплокарта = document.getElementById("heatmap");
const пульсКанвас = document.getElementById("pulseCanvas");
let пульсКонтекст = пульсКанвас.getContext("2d");
let попередніНорм = Array(індекси.length).fill(50);
let попередніДельти = Array(індекси.length).fill(0);
let історіяПульсу = [];
let історіяТрендів = індекси.map(()=>[]);

індекси.forEach((інд, i)=>{
  const клітинка = document.createElement("div");
  клітинка.className = "cell";
  клітинка.id = "cell" + i;
  клітинка.innerHTML = `${інд.назва}<div class="value">— ${інд.одиниця||''}</div><div class="tooltip"></div><canvas class="trendCanvas" id="trend${i}"></canvas>`;
  теплокарта.appendChild(клітинка);
});

const центр = document.createElement("div");
центр.className = "center-index";
центр.id = "center";
центр.textContent = "Стан системи: —";
теплокарта.appendChild(центр);

function адаптуватиКанваси() {
  const трендКанваси = document.querySelectorAll('.trendCanvas');
  трендКанваси.forEach(к => {
    к.width = к.parentElement.clientWidth - 12;
    к.height = 80;
  });
  пульсКанвас.width = пульсКанвас.parentElement.clientWidth - 40;
  пульсКанвас.height = 200;
  намалюватиПульс();
  історіяТрендів.forEach((_,i) => намалюватиТренд(i));
}
window.addEventListener('resize', адаптуватиКанваси);
setTimeout(адаптуватиКанваси, 100);

async function отриматиЗначення(інд) {
  try {
    const відповідь = await fetch(інд.api, {headers: {'User-Agent': 'IbariumHeatmap/1.0'}});
    if (!відповідь.ok) throw new Error(відповідь.status);
    const дані = await відповідь.json();
    return інд.витягти(дані);
  } catch (е) {
    console.error(`Помилка ${інд.назва}:`, е);
    return null;
  }
}

function нормалізувати(знач, мін, макс) {
  if (знач === null) return null;
  return Math.max(0, Math.min(100, ((знач - мін) / (макс - мін)) * 100));
}

function отриматиКолір(норм) {
  if (норм < 30) return {фон:"#ff0000", тривога:true};
  if (норм < 70) return {фон:"#ffaa00", тривога:false};
  return {фон:"#00ff00", тривога:false};
}

async function оновити(тип) {
  const обіцянки = індекси.filter(інд => інд.тип === тип).map(отриматиЗначення);
  const сиріЗначення = await Promise.all(обіцянки);
  let загальнаНорм = 0;
  let кількістьВалідних = 0;
  let індекс = 0;

  індекси.forEach((інд, i) => {
    if (інд.тип === тип) {
      const сире = сиріЗначення[індекс++];
      const норм = сире !== null ? нормалізувати(сире, інд.мін, інд.макс) : попередніНорм[i];
      if (норм !== null) {
        попередніНорм[i] = норм;
        попередніДельти[i] = історіяТрендів[i].length > 0 ? норм - історіяТрендів[i][історіяТрендів[i].length-1] : 0;
        загальнаНорм += норм;
        кількістьВалідних++;
      }
      const клітинка = document.getElementById("cell" + i);
      const значенняЕл = клітинка.querySelector(".value");
      const підказка = клітинка.querySelector(".tooltip");
      if (сире !== null) значенняЕл.textContent = `${сире.toFixed ? сире.toFixed(2) : сире} ${інд.одиниця||''} (${норм?.toFixed(0)}%)`;
      else значенняЕл.textContent = `— (${попередніНорм[i].toFixed(0)}%)`;
      підказка.textContent = `Дельта: ${попередніДельти[i].toFixed(1)}%`;
      const {фон, тривога} = отриматиКолір(попередніНорм[i]);
      клітинка.style.background = фон;
      if (тривога) клітинка.classList.add("alert"); else клітинка.classList.remove("alert");
      if (норм !== null) історіяТрендів[i].push(норм);
      if (історіяТрендів[i].length > 120) історіяТрендів[i].shift();
      намалюватиТренд(i);
    } else if (попередніНорм[i] !== null) {
      загальнаНорм += попередніНорм[i];
      кількістьВалідних++;
    }
  });

  const середняНорм = кількістьВалідних > 0 ? загальнаНорм / кількістьВалідних : 50;
  історіяПульсу.push(середняНорм);
  if (історіяПульсу.length > 300) історіяПульсу.shift();
  намалюватиПульс();

  let статус = "Норма";
  let колірСтатусу = "#ffaa00";
  if (середняНорм < 30) { статус = "Погано"; колірСтатусу = "#ff0000"; }
  else if (середняНорм > 70) { статус = "Добре"; колірСтатусу = "#00ff00"; }
  центр.textContent = `Стан системи: ${статус} (${середняНорм.toFixed(1)}%)`;
  центр.style.borderColor = колірСтатусу;
}

function намалюватиТренд(i) {
  const канвас = document.getElementById(`trend${i}`);
  const контекст = канвас.getContext("2d");
  контекст.clearRect(0, 0, канвас.width, канвас.height);
  if (історіяТрендів[i].length < 2) return;
  контекст.strokeStyle = "#00ffdd";
  контекст.lineWidth = 2;
  контекст.beginPath();
  історіяТрендів[i].forEach((норм, j) => {
    const x = j * (канвас.width / (історіяТрендів[i].length - 1));
    const y = канвас.height * (1 - норм / 100);
    if (j === 0) контекст.moveTo(x, y); else контекст.lineTo(x, y);
  });
  контекст.stroke();
}

function намалюватиПульс() {
  пульсКонтекст.clearRect(0, 0, пульсКанвас.width, пульсКанвас.height);
  if (історіяПульсу.length < 2) return;
  пульсКонтекст.strokeStyle = "#ff00ff";
  пульсКонтекст.lineWidth = 3;
  пульсКонтекст.beginPath();
  історіяПульсу.forEach((в, i) => {
    const x = i * (пульсКанвас.width / (історіяПульсу.length - 1));
    const y = пульсКанвас.height * (1 - в / 100);
    if (i === 0) пульсКонтекст.moveTo(x, y); else пульсКонтекст.lineTo(x, y);
  });
  пульсКонтекст.stroke();
}

оновити("реалтайм");
оновити("щогодинно");
setInterval(() => оновити("реалтайм"), 60000);
setInterval(() => оновити("щогодинно"), 3600000);
