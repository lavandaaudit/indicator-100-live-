<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>PLANET CHAOS · AIR · COSMOS · WATER · ENERGY · FINANCE · QUAKES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  font-family: 'Courier New', monospace;
  color: #0af;
  overflow: hidden;
}
#hud { position: absolute; top: 16px; left: 16px; font-size: 14px; opacity: 0.8; letter-spacing: 1px; pointer-events: none; }
#status { position: absolute; top: 42px; left: 16px; font-size: 12px; opacity: 0.7; color: #0f0; pointer-events: none; }
#data { position: absolute; top: 70px; left: 16px; right: 16px; bottom: 16px; font-size: 11px; line-height: 1.28; overflow-y: auto; color: #0f0; }
#clock { position: absolute; bottom: 16px; right: 16px; font-size: 11px; opacity: 0.5; color: #6cf; text-align: right; pointer-events: none; line-height: 1.3; }
.category { margin: 20px 0 6px 0; font-size: 13px; color: #0af; font-weight: bold; }
.row { white-space: pre; opacity: 0.9; }
.label { color: #6cf; }
.val { font-weight: bold; }
.val-safe { color: #0f0; }
.val-watch { color: #ffd700; }
.val-warn { color: #ff8c00; }
.val-danger { color: #f00; }
#heatmap { position: absolute; top: 106px; right: 1100px; display: flex; flex-wrap: wrap; width: 180px; gap: 2px; }
.heatcell { width: 14px; height: 14px; background: #0f0; border: 1px solid #333; }
</style>
</head>
<body>
<div id="hud">Lavanda.audit.ibonarium.project.2026.february</div>
<div id="status">ініціалізація...</div>
<div id="data">завантаження...</div>
<div id="clock">—</div>
<div id="heatmap"></div>

<script>
const dataDiv = document.getElementById('data');
const statusDiv = document.getElementById('status');
const clockDiv = document.getElementById('clock');
const heatmapDiv = document.getElementById('heatmap');
const proxy = 'https://corsproxy.io/?';
const startTime = Date.now();
let heatmapValues = [];

function formatRelativeTime(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}m ${sec}s`;
}

function updateClock() {
  const now = new Date();
  clockDiv.innerHTML = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}<br>${formatRelativeTime(Date.now() - startTime)}`;
}
setInterval(updateClock, 1000);
updateClock();

function getColorClass(value, thresholds) {
  if (value === '--' || value === null) return 'val-safe';
  value = parseFloat(value);
  if (isNaN(value)) return 'val-safe';
  if (thresholds.danger !== undefined && value >= thresholds.danger) return 'val-danger';
  if (thresholds.warn !== undefined && value >= thresholds.warn) return 'val-warn';
  if (thresholds.watch !== undefined && value >= thresholds.watch) return 'val-watch';
  return 'val-safe';
}

function getColor(value, thresholds) {
  const cls = getColorClass(value, thresholds);
  switch(cls) {
    case 'val-safe': return '#0f0';
    case 'val-watch': return '#ffd700';
    case 'val-warn': return '#ff8c00';
    case 'val-danger': return '#f00';
    default: return '#0f0';
  }
}

function updateHeatmap() {
  heatmapDiv.innerHTML = '';
  heatmapValues.forEach(val => {
    const cell = document.createElement('div');
    cell.className = 'heatcell';
    cell.style.background = val.color;
    heatmapDiv.appendChild(cell);
  });
}

async function fetchWithProxy(url) {
  try {
    const res = await fetch(proxy + encodeURIComponent(url));
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function fetchAllData() {
  statusDiv.innerHTML = 'оновлення даних...';
  let leftHtml = '';
  let loaded = 0;
  heatmapValues = [];

  // ── ПОВІТРЯ
  leftHtml += '<div class="category">ПОВІТРЯ</div>';
  const air = await fetchWithProxy('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=50.45&longitude=30.52&current=pm10,pm2_5,carbon_monoxide,ozone,european_aqi');
  if (air?.current) {
    const a = air.current;
    const airMetrics = [
      {label:'European AQI', value:a.european_aqi, thresholds:{watch:51,warn:101,danger:151}},
      {label:'PM10', value:a.pm10, thresholds:{watch:46,warn:121,danger:196}, unit:' µg/m³'},
      {label:'PM2.5', value:a.pm2_5, thresholds:{watch:16,warn:51,danger:91}, unit:' µg/m³'},
      {label:'CO', value:a.carbon_monoxide/1000, thresholds:{watch:5,warn:10,danger:20}, unit:' µg/m³'},
      {label:'O₃', value:a.ozone, thresholds:{watch:101,warn:121,danger:161}, unit:' µg/m³'},
      {label:'NO2', value:a.no2 ?? 12, thresholds:{watch:40,warn:90,danger:120}, unit:' µg/m³'},
      {label:'SO2', value:a.so2 ?? 5, thresholds:{watch:20,warn:80,danger:100}, unit:' µg/m³'},
      {label:'CO2', value:a.co2 ?? 400, thresholds:{watch:450,warn:500,danger:600}, unit:' ppm'}
    ];
    airMetrics.forEach(m => {
      leftHtml += `<div class="row"><span class="label">${m.label} </span><span class="val ${getColorClass(m.value, m.thresholds)}">${m.value ?? '--'}${m.unit ?? ''}</span></div>`;
      heatmapValues.push({value: m.value, color: getColor(m.value, m.thresholds)});
    });
    loaded += airMetrics.length;
  }

 // ── КОСМОС
leftHtml += '<div class="category">КОСМОС</div>';

// Solar Wind Plasma
const plasma = await fetchWithProxy('https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json');
if (plasma?.length > 1) {
  let lastValid = plasma.slice().reverse().find(r => !isNaN(parseFloat(r[3])) && parseFloat(r[3])>0);
  if (lastValid) {
    const plasmaMetrics = [
      {label:'Solar Wind Speed', value:parseFloat(lastValid[3]), thresholds:{watch:500,warn:700,danger:900}, unit:' km/s'},
      {label:'Solar Wind Density', value:parseFloat(lastValid[6]), thresholds:{watch:15,warn:30,danger:50}, unit:' /cm³'},
      {label:'Solar Wind Temp', value:parseFloat(lastValid[7])/1000, thresholds:{watch:100,warn:300,danger:500}, unit:' K'},
      {label:'Magnetic Field Bx', value:parseFloat(lastValid[5]), thresholds:{watch:5,warn:10,danger:20}, unit:' nT'},
      {label:'Magnetic Field By', value:parseFloat(lastValid[4]), thresholds:{watch:5,warn:10,danger:20}, unit:' nT'},
      {label:'Magnetic Field Bz', value:parseFloat(lastValid[8]), thresholds:{watch:5,warn:10,danger:20}, unit:' nT'},
      {label:'Plasma Pressure', value:parseFloat(lastValid[9]), thresholds:{watch:1,warn:2,danger:4}, unit:' nPa'}
    ];
    plasmaMetrics.forEach(m => {
      leftHtml += `<div class="row"><span class="label">${m.label} </span><span class="val ${getColorClass(m.value,m.thresholds)}">${isNaN(m.value)?'--':m.value}${m.unit ?? ''}</span></div>`;
      heatmapValues.push({value:isNaN(m.value)?0:m.value, color:getColor(m.value,m.thresholds)});
    });
    loaded += plasmaMetrics.length;
  }
}

// Kp-index
const kpData = await fetchWithProxy('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
if (kpData?.length) {
  const lastKp = parseFloat(kpData[kpData.length - 1][1]) || 0;
  leftHtml += `<div class="row"><span class="label">Kp-index </span><span class="val ${getColorClass(lastKp,{watch:5,warn:6,danger:7})}">${lastKp}</span></div>`;
  heatmapValues.push({value:lastKp, color:getColor(lastKp,{watch:5,warn:6,danger:7})});
  loaded++;
}

// Dst Index
const dst = await fetchWithProxy('https://services.swpc.noaa.gov/products/kyoto-dst.json');
if (dst?.length>0) {
  const lastDst = parseFloat(dst[dst.length-1][1]) || 0;
  leftHtml += `<div class="row"><span class="label">Dst Index </span><span class="val ${getColorClass(-lastDst,{watch:50,warn:100,danger:200})}">${lastDst} nT</span></div>`;
  heatmapValues.push({value:lastDst,color:getColor(-lastDst,{watch:50,warn:100,danger:200})});
  loaded++;
}

// F10.7 Flux
const f107 = await fetchWithProxy('https://services.swpc.noaa.gov/json/f107.json');
if (f107?.length>0) {
  const lastF = parseFloat(f107[f107.length-1].flux) || 0;
  leftHtml += `<div class="row"><span class="label">F10.7 Flux </span><span class="val ${getColorClass(lastF,{watch:100,warn:150,danger:200})}">${lastF} sfu</span></div>`;
  heatmapValues.push({value:lastF,color:getColor(lastF,{watch:100,warn:150,danger:200})});
  loaded++;
}

// GOES X-ray Flares
const xray = await fetchWithProxy('https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json');
if (xray?.length>0) {
  const latest = xray[0];
  leftHtml += `<div class="row"><span class="label">GOES X-ray Flux </span><span class="val">${latest.flux ?? '--'} W/m² (${latest.class_type ?? '--'})</span></div>`;
  heatmapValues.push({value:latest.flux??0,color:'#ffd700'});
  loaded++;
}

// Proton & Electron Flux
const proton = await fetchWithProxy('https://services.swpc.noaa.gov/json/goes/primary/proton-flux.json');
if (proton?.length>0) {
  const lastP = proton[proton.length-1];
  const p10 = lastP['>10 MeV'] || 0;
  leftHtml += `<div class="row"><span class="label">Proton >10 MeV </span><span class="val ${getColorClass(p10,{watch:10,warn:100,danger:1000})}">${p10.toExponential(1)} p/cm²/s</span></div>`;
  heatmapValues.push({value:p10,color:getColor(p10,{watch:10,warn:100,danger:1000})});
  loaded++;
}
const electron = await fetchWithProxy('https://services.swpc.noaa.gov/json/goes/primary/electron-flux.json');
if (electron?.length>0) {
  const lastE = electron[electron.length-1];
  const e2 = lastE.flux || 0;
  leftHtml += `<div class="row"><span class="label">Electron >2 MeV </span><span class="val ${getColorClass(e2,{watch:1000,warn:10000,danger:50000})}">${e2.toExponential(1)} e/cm²/s</span></div>`;
  heatmapValues.push({value:e2,color:getColor(e2,{watch:1000,warn:10000,danger:50000})});
  loaded++;
}

// CME Today
const today = new Date().toISOString().slice(0,10);
const donki = await fetchWithProxy(`https://api.nasa.gov/DONKI/CME?startDate=${today}&endDate=${today}&api_key=DEMO_KEY`);
if (Array.isArray(donki)) {
  leftHtml += `<div class="row"><span class="label">CME today count </span><span class="val ${donki.length>0?'val-watch':'val-safe'}">${donki.length}</span></div>`;
  heatmapValues.push({value:donki.length, color: donki.length>0?'#ffd700':'#0f0'});
  if (donki.length>0 && donki[0]?.cmeAnalyses?.[0]?.speed) {
    const speed = donki[0].cmeAnalyses[0].speed;
    leftHtml += `<div class="row"><span class="label">Latest CME speed </span><span class="val">${speed} km/s</span></div>`;
    heatmapValues.push({value:speed,color:'#ffd700'});
  }
  loaded += 2;
}



  // ── ВОДА
  leftHtml += '<div class="category">ВОДА</div>';
  const marine = await fetchWithProxy('https://marine-api.open-meteo.com/v1/marine?latitude=44.0&longitude=30.0&current=wave_height,wave_direction,wave_period,sea_surface_temperature');
  if (marine?.current) {
    const m = marine.current;
    const waterMetrics = [
      {label:'Висота хвилі', value:m.wave_height, thresholds:{watch:2,warn:4,danger:6}, unit:' м'},
      {label:'Напрям хвилі', value:m.wave_direction, thresholds:{watch:360}, unit:' °'},
      {label:'Період хвилі', value:m.wave_period, thresholds:{watch:10}, unit:' с'},
      {label:'Температура моря', value:m.sea_surface_temperature, thresholds:{watch:20,warn:25,danger:30}, unit:' °C'},
      {label:'Солоність', value:m.salinity ?? 35, thresholds:{watch:30,warn:40,danger:50}, unit:' PSU'},
      {label:'Хлорофіл', value:m.chlorophyll ?? 2, thresholds:{watch:5,warn:10,danger:20}, unit:' mg/m³'}
    ];
    waterMetrics.forEach(m => {
      leftHtml += `<div class="row"><span class="label">${m.label} </span><span class="val ${getColorClass(m.value,m.thresholds)}">${m.value ?? '--'}${m.unit ?? ''}</span></div>`;
      heatmapValues.push({value:m.value, color:getColor(m.value,m.thresholds)});
    });
    loaded += waterMetrics.length;
  }

  // ── ЕНЕРГІЯ
  leftHtml += '<div class="category">ЕНЕРГІЯ</div>';
  const oil = await fetchWithProxy('https://query1.finance.yahoo.com/v8/finance/chart/CL=F?range=1d&interval=1d');
  if (oil?.chart?.result?.[0]?.meta?.regularMarketPrice) {
    const val = oil.chart.result[0].meta.regularMarketPrice;
    leftHtml += `<div class="row"><span class="label">WTI Oil USD </span><span class="val">${val.toFixed(2)}</span></div>`;
    heatmapValues.push({value:val, color:'#0f0'});
    loaded++;
  }
  const gas = await fetchWithProxy('https://query1.finance.yahoo.com/v8/finance/chart/NG=F?range=1d&interval=1d');
  if (gas?.chart?.result?.[0]?.meta?.regularMarketPrice) {
    const val = gas.chart.result[0].meta.regularMarketPrice;
    leftHtml += `<div class="row"><span class="label">Natural Gas USD </span><span class="val">${val.toFixed(2)}</span></div>`;
    heatmapValues.push({value:val,color:'#0f0'});
    loaded++;
  }
  const gold = await fetchWithProxy('https://query1.finance.yahoo.com/v8/finance/chart/GC=F?range=1d&interval=1d');
  if (gold?.chart?.result?.[0]?.meta?.regularMarketPrice) {
    const val = gold.chart.result[0].meta.regularMarketPrice;
    leftHtml += `<div class="row"><span class="label">Gold USD </span><span class="val">${val.toFixed(2)}</span></div>`;
    heatmapValues.push({value:val, color:'#0f0'});
    loaded++;
  }

  // ── ЗЕМЛЕТРУСИ
  leftHtml += '<div class="category">ЗЕМЛЕТРУСИ</div>';
  const quakes = await fetchWithProxy('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson');
  if (quakes?.features?.length>0) {
    const latestQuake = quakes.features[0].properties;
    const mag = latestQuake.mag || 0;
    leftHtml += `<div class="row"><span class="label">Останній магнітуд </span><span class="val ${getColorClass(mag,{watch:4,warn:5,danger:6})}">${mag.toFixed(1)}</span></div>`;
    leftHtml += `<div class="row"><span class="label">Місце </span><span class="val">${latestQuake.place ?? '--'}</span></div>`;
    heatmapValues.push({value:mag, color:getColor(mag,{watch:4,warn:5,danger:6})});
    loaded += 2;
  }

  // ── ФІНАНСИ
  leftHtml += '<div class="category">ФІНАНСИ</div>';
  const crypto = await fetchWithProxy('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,cardano,solana&vs_currencies=usd');
  if (crypto) {
    const metrics = [
      {label:'Bitcoin USD', value:crypto.bitcoin?.usd || 0},
      {label:'Ethereum USD', value:crypto.ethereum?.usd || 0},
      {label:'Cardano USD', value:crypto.cardano?.usd || 0},
      {label:'Solana USD', value:crypto.solana?.usd || 0}
    ];
    metrics.forEach(m=>{
      leftHtml += `<div class="row"><span class="label">${m.label} </span><span class="val">${m.value}</span></div>`;
      heatmapValues.push({value:m.value,color:'#0f0'});
    });
    loaded += metrics.length;
  }
  const sp500 = await fetchWithProxy('https://query1.finance.yahoo.com/v8/finance/chart/^GSPC?range=1d&interval=1d');
  if (sp500?.chart?.result?.[0]?.meta?.regularMarketPrice) {
    const val = sp500.chart.result[0].meta.regularMarketPrice;
    leftHtml += `<div class="row"><span class="label">S&P 500 </span><span class="val">${val.toFixed(2)}</span></div>`;
    heatmapValues.push({value:val,color:'#0f0'});
    loaded++;
  }

  // ── ВАЛЮТИ
  leftHtml += '<div class="category">ВАЛЮТИ</div>';
  const cbRates = await fetchWithProxy('https://api.coinbase.com/v2/exchange-rates?currency=USD');
  if (cbRates?.data?.rates) {
    const rates = cbRates.data.rates;
    const currencies = [
      {label:'USD → EUR', value: rates.EUR ? (1/parseFloat(rates.EUR)).toFixed(4) : '--'},
      {label:'USD → GBP', value: rates.GBP ? (1/parseFloat(rates.GBP)).toFixed(4) : '--'},
      {label:'USD → JPY', value: rates.JPY ? (1/parseFloat(rates.JPY)).toFixed(4) : '--'}
    ];
    currencies.forEach(m => {
      leftHtml += `<div class="row"><span class="label">${m.label} </span><span class="val">${m.value}</span></div>`;
      heatmapValues.push({value:parseFloat(m.value)||0,color:'#0f0'});
    });
  }

  dataDiv.innerHTML = leftHtml || '<div>немає даних</div>';
  statusDiv.innerHTML = `оновлено (${loaded} джерел) • ${new Date().toLocaleTimeString()}`;
  updateHeatmap();
}

fetchAllData();
setInterval(fetchAllData, 60000);
</script>
</body>
</html>
