<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>PLANET CHAOS · AIR · COSMOS · WATER · ENERGY · FINANCE · QUAKES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  font-family: 'Courier New', monospace;
  color: #0af;
  overflow: hidden;
}
#hud {
  position: absolute;
  top: 16px;
  left: 16px;
  font-size: 14px;
  opacity: 0.8;
  letter-spacing: 1px;
  pointer-events: none;
}
#status {
  position: absolute;
  top: 42px;
  left: 16px;
  font-size: 12px;
  opacity: 0.7;
  color: #0f0;
  pointer-events: none;
}
#data {
  position: absolute;
  top: 70px;
  left: 16px;
  right: 16px;
  bottom: 16px;
  font-size: 11px;
  line-height: 1.28;
  overflow-y: auto;
  color: #0f0;
}
#clock {
  position: absolute;
  bottom: 16px;
  right: 16px;
  font-size: 11px;
  opacity: 0.5;
  color: #6cf;
  text-align: right;
  pointer-events: none;
  line-height: 1.3;
}
.category {
  margin: 20px 0 6px 0;
  font-size: 13px;
  color: #0af;
  font-weight: bold;
}
.row {
  white-space: pre;
  opacity: 0.9;
}
.label { color: #6cf; }
.val { font-weight: bold; }
.val-safe { color: #0f0; }     /* зелений - OK */
.val-watch { color: #ffd700; } /* жовтий - увага */
.val-warn { color: #ff8c00; }  /* помаранчевий - попередження */
.val-danger { color: #f00; }   /* червоний - небезпека */
</style>
</head>
<body>
<div id="hud">PLANET CHAOS — REAL DATA FROM APIs</div>
<div id="status">ініціалізація...</div>
<div id="data">завантаження...</div>
<div id="clock">—</div>

<script>
const dataDiv = document.getElementById('data');
const statusDiv = document.getElementById('status');
const clockDiv = document.getElementById('clock');
const proxy = 'https://corsproxy.io/?';
const startTime = Date.now();

function formatRelativeTime(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}m ${sec}s`;
}

function updateClock() {
  const now = new Date();
  clockDiv.innerHTML = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}<br>${formatRelativeTime(Date.now() - startTime)}`;
}
setInterval(updateClock, 1000);
updateClock();

function getColorClass(value, thresholds) {
  if (value === '--' || value === null) return 'val-safe';
  value = parseFloat(value);
  if (isNaN(value)) return 'val-safe';
  if (thresholds.danger !== undefined && value >= thresholds.danger) return 'val-danger';
  if (thresholds.warn !== undefined && value >= thresholds.warn) return 'val-warn';
  if (thresholds.watch !== undefined && value >= thresholds.watch) return 'val-watch';
  return 'val-safe';
}

async function fetchWithProxy(url) {
  try {
    const res = await fetch(proxy + encodeURIComponent(url));
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function fetchAllData() {
  statusDiv.innerHTML = 'оновлення даних...';
  let leftHtml = '';
  let loaded = 0;

  // ── ПОВІТРЯ
  leftHtml += '<div class="category">ПОВІТРЯ</div>';
  const air = await fetchWithProxy('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=50.45&longitude=30.52&current=pm10,pm2_5,carbon_monoxide,ozone,european_aqi');
  if (air?.current) {
    const a = air.current;
    leftHtml += `<div class="row"><span class="label">European AQI </span><span class="val ${getColorClass(a.european_aqi, {watch:51,warn:101,danger:151})}">${a.european_aqi ?? '--'}</span></div>`;
    leftHtml += `<div class="row"><span class="label">PM10 </span><span class="val ${getColorClass(a.pm10, {watch:46,warn:121,danger:196})}">${a.pm10 ?? '--'} µg/m³</span></div>`;
    leftHtml += `<div class="row"><span class="label">PM2.5 </span><span class="val ${getColorClass(a.pm2_5, {watch:16,warn:51,danger:91})}">${a.pm2_5 ?? '--'} µg/m³</span></div>`;
    leftHtml += `<div class="row"><span class="label">CO </span><span class="val ${getColorClass(a.carbon_monoxide / 1000, {watch:5,warn:10,danger:20})}">${a.carbon_monoxide ?? '--'} µg/m³</span></div>`;
    leftHtml += `<div class="row"><span class="label">O₃ </span><span class="val ${getColorClass(a.ozone, {watch:101,warn:121,danger:161})}">${a.ozone ?? '--'} µg/m³</span></div>`;
    loaded += 5;
  }

  // ── КОСМОС
  leftHtml += '<div class="category">КОСМОС</div>';
  const plasma = await fetchWithProxy('https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json');
  if (plasma?.length > 1) {
    const last = plasma[plasma.length - 1];
    const speed = parseFloat(last[3]) || 0;
    const density = parseFloat(last[6]) || 0;
    const temp = parseFloat(last[7]) || 0;
    leftHtml += `<div class="row"><span class="label">Solar Wind Speed </span><span class="val ${getColorClass(speed,{watch:500,warn:700,danger:900})}">${speed.toFixed(0) ?? '--'} km/s</span></div>`;
    leftHtml += `<div class="row"><span class="label">Solar Wind Density </span><span class="val ${getColorClass(density,{watch:15,warn:30,danger:50})}">${density.toFixed(1) ?? '--'} /cm³</span></div>`;
    leftHtml += `<div class="row"><span class="label">Solar Wind Temp </span><span class="val ${getColorClass(temp/1000,{watch:100,warn:300,danger:500})}">${temp.toFixed(0) ?? '--'} K</span></div>`;
    loaded += 3;
  }

  const kpData = await fetchWithProxy('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
  if (kpData?.length) {
    const lastKp = kpData[kpData.length - 1];
    const kp = parseFloat(lastKp[1]) || 0;
    leftHtml += `<div class="row"><span class="label">Kp-index </span><span class="val ${getColorClass(kp,{watch:5,warn:6,danger:7})}">${lastKp[1] ?? '--'}</span></div>`;
    loaded++;
  }

  const today = new Date().toISOString().slice(0,10);
  const donki = await fetchWithProxy(`https://api.nasa.gov/DONKI/CME?startDate=${today}&endDate=${today}&api_key=DEMO_KEY`);
  if (Array.isArray(donki)) {
    leftHtml += `<div class="row"><span class="label">CME today count </span><span class="val ${donki.length>0?'val-watch':'val-safe'}">${donki.length}</span></div>`;
    if (donki.length>0 && donki[0]?.cmeAnalyses?.[0]?.speed) {
      leftHtml += `<div class="row"><span class="label">Latest CME speed </span><span class="val">${donki[0].cmeAnalyses[0].speed} km/s</span></div>`;
    }
    loaded += 2;
  }

  const xray = await fetchWithProxy('https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json');
  if (xray?.length>0) {
    const latest = xray[0];
    leftHtml += `<div class="row"><span class="label">GOES X-ray Flux </span><span class="val">${latest.flux ?? '--'} W/m² (${latest.class_type ?? '--'})</span></div>`;
    loaded++;
  }

  const proton = await fetchWithProxy('https://services.swpc.noaa.gov/json/goes/primary/proton-flux.json');
  if (proton?.length>0) {
    const lastP = proton[proton.length-1];
    const p10 = lastP['>10 MeV'] || 0;
    leftHtml += `<div class="row"><span class="label">Proton >10 MeV </span><span class="val ${getColorClass(p10,{watch:10,warn:100,danger:1000})}">${p10.toExponential(1) ?? '--'} p/cm²/s</span></div>`;
    loaded++;
  }

  const electron = await fetchWithProxy('https://services.swpc.noaa.gov/json/goes/primary/electron-flux.json');
  if (electron?.length>0) {
    const lastE = electron[electron.length-1];
    const e2 = lastE.flux || 0;
    leftHtml += `<div class="row"><span class="label">Electron >2 MeV </span><span class="val ${getColorClass(e2,{watch:1000,warn:10000,danger:50000})}">${e2.toExponential(1) ?? '--'} e/cm²/s</span></div>`;
    loaded++;
  }

  const dst = await fetchWithProxy('https://services.swpc.noaa.gov/products/kyoto-dst.json');
  if (dst?.length>0) {
    const lastDst = dst[dst.length-1];
    const dstVal = parseFloat(lastDst[1]) || 0;
    leftHtml += `<div class="row"><span class="label">Dst Index </span><span class="val ${getColorClass(-dstVal,{watch:50,warn:100,danger:200})}">${dstVal ?? '--'} nT</span></div>`;
    loaded++;
  }

  const f107 = await fetchWithProxy('https://services.swpc.noaa.gov/json/f107.json');
  if (f107?.length>0) {
    const lastF = f107[f107.length-1];
    const fVal = parseFloat(lastF.flux) || 0;
    leftHtml += `<div class="row"><span class="label">F10.7 Flux </span><span class="val ${getColorClass(fVal,{watch:100,warn:150,danger:200})}">${fVal ?? '--'} sfu</span></div>`;
    loaded++;
  }

  // ── ВОДА
  leftHtml += '<div class="category">ВОДА</div>';
  const marine = await fetchWithProxy('https://marine-api.open-meteo.com/v1/marine?latitude=44.0&longitude=30.0&current=wave_height,wave_direction,wave_period,sea_surface_temperature');
  if (marine?.current) {
    const m = marine.current;
    leftHtml += `<div class="row"><span class="label">Висота хвилі </span><span class="val ${getColorClass(m.wave_height,{watch:2,warn:4,danger:6})}">${m.wave_height ?? '--'} м</span></div>`;
    leftHtml += `<div class="row"><span class="label">Напрям хвилі </span><span class="val">${m.wave_direction ?? '--'} °</span></div>`;
    leftHtml += `<div class="row"><span class="label">Період хвилі </span><span class="val">${m.wave_period ?? '--'} с</span></div>`;
    leftHtml += `<div class="row"><span class="label">Температура моря </span><span class="val">${m.sea_surface_temperature ?? '--'} °C</span></div>`;
    loaded += 4;
  }

  // ── ЕНЕРГІЯ
  leftHtml += '<div class="category">ЕНЕРГІЯ</div>';
  const oil = await fetchWithProxy('https://query1.finance.yahoo.com/v8/finance/chart/CL=F?range=1d&interval=1d');
  if (oil?.chart?.result?.[0]?.meta?.regularMarketPrice) {
    leftHtml += `<div class="row"><span class="label">WTI Oil USD </span><span class="val">${oil.chart.result[0].meta.regularMarketPrice.toFixed(2) ?? '--'}</span></div>`;
    loaded++;
  }
  const gold = await fetchWithProxy('https://query1.finance.yahoo.com/v8/finance/chart/GC=F?range=1d&interval=1d');
  if (gold?.chart?.result?.[0]?.meta?.regularMarketPrice) {
    leftHtml += `<div class="row"><span class="label">Gold USD </span><span class="val">${gold.chart.result[0].meta.regularMarketPrice.toFixed(2) ?? '--'}</span></div>`;
    loaded++;
  }

  // ── ЗЕМЛЕТРУСИ
  leftHtml += '<div class="category">ЗЕМЛЕТРУСИ</div>';
  const quakes = await fetchWithProxy('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson');
  if (quakes?.features?.length>0) {
    const latestQuake = quakes.features[0].properties;
    const mag = latestQuake.mag || 0;
    leftHtml += `<div class="row"><span class="label">Останній магнітуд </span><span class="val ${getColorClass(mag,{watch:4,warn:5,danger:6})}">${mag.toFixed(1) ?? '--'}</span></div>`;
    leftHtml += `<div class="row"><span class="label">Місце </span><span class="val">${latestQuake.place ?? '--'}</span></div>`;
    loaded += 2;
  }

  // ── ФІНАНСИ
  leftHtml += '<div class="category">ФІНАНСИ</div>';
  const crypto = await fetchWithProxy('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
  if (crypto) {
    leftHtml += `<div class="row"><span class="label">Bitcoin USD </span><span class="val">${crypto.bitcoin?.usd ?? '--'}</span></div>`;
    leftHtml += `<div class="row"><span class="label">Ethereum USD </span><span class="val">${crypto.ethereum?.usd ?? '--'}</span></div>`;
    loaded += 2;
  }

  const sp500 = await fetchWithProxy('https://query1.finance.yahoo.com/v8/finance/chart/^GSPC?range=1d&interval=1d');
  if (sp500?.chart?.result?.[0]?.meta?.regularMarketPrice) {
    leftHtml += `<div class="row"><span class="label">S&P 500 </span><span class="val">${sp500.chart.result[0].meta.regularMarketPrice.toFixed(2) ?? '--'}</span></div>`;
    loaded++;
  }

  // ── ВАЛЮТИ
  leftHtml += '<div class="category">ВАЛЮТИ</div>';
  const cbRates = await fetchWithProxy('https://api.coinbase.com/v2/exchange-rates?currency=USD');
  if (cbRates?.data?.rates) {
    const rates = cbRates.data.rates;
    leftHtml += `<div class="row"><span class="label">USD → EUR </span><span class="val">${rates.EUR ? (1/parseFloat(rates.EUR)).toFixed(4) : '--'}</span></div>`;
    // ... інші валюти
    loaded += 10;
  } else {
    for (let i=0;i<10;i++) leftHtml += `<div class="row"><span class="label">-- </span><span class="val">--</span></div>`;
  }

  dataDiv.innerHTML = leftHtml || '<div>немає даних</div>';
  statusDiv.innerHTML = `оновлено (${loaded} джерел) • ${new Date().toLocaleTimeString()}`;
}

fetchAllData();
setInterval(fetchAllData, 60000);
</script>
</body>
</html>
